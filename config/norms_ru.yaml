# Анализ всей истории анализов (src/deficitlens_core/history.py; поток П4, ADR 0009, docs/CONTRACTS.md).
# События динамики, сроки «давно» для полноты картины и «шум» для направления ряда. В КР Минздрава РФ и у ВОЗ
# числовых порогов динамики для взрослых вне беременности нет: все числа раздела — выбор проекта, окончательно
# решает врач команды. Пороги ферритина 30 / 15 мкг/л здесь НЕ дублируются: событие ferritin_drop и срок для
# низкого ферритина берут их из ferritin.deficiency_below (ru — практика РФ, who — ВОЗ 2020).
# Месяцы — календарные: «в окне 12 мес» — ранний анализ не раньше даты последнего минус 12 месяцев (граница входит);
# «старше 12 мес» — дата анализа плюс 12 месяцев раньше сегодняшней даты.
history:
  source: project
  status: needs_medical_expert
  note: "Пороги динамики и сроки «давно» — выбор проекта: в КР РФ и у ВОЗ таких чисел для взрослых нет; ожидают подтверждения врачом"
  hb_drop:                       # снижение гемоглобина к последнему анализу от МЕДИАНЫ предыдущих анализов в окне (устойчиво
                                 # к «шуму»; максимум шумного ряда давал ложные события) или от предыдущего анализа; при ряде
                                 # up/flat за всю историю «снизился» пишется только от предыдущего анализа (history.py, _hb_drop)
    min_drop_g_l: 10             # г/л: снижение не меньше этого…
    min_drop_pct: 10             # …или не меньше этой доли базы (медианы окна или предыдущего значения), %
    window_months: 12            # предыдущие анализы — не дальше стольких месяцев до последнего
  ferritin_drop:                 # ферритин: падение от наибольшего значения в окне или переход порогов ferritin.deficiency_below
    min_drop_pct: 30             # %
    window_months: 24
    # Переход порога засчитывается, только если снижение не меньше «шума» ферритина (flat.pct.ferritin): 31 → 29 мкг/л —
    # колебание, а не событие. Правило проекта, не решение врача; при СРБ выше crp.inflammation_above в любой из двух
    # точек событие помечается «на ферритин влияло воспаление».
    crossing_beyond_flat: true
  mcv_drift:                     # сдвиг MCV к микроцитозу (вниз) или к макроцитозу (вверх): последнее против медианы предыдущих в окне
    min_change_fl: 5             # фл
    window_months: 24
  persistent_signal:             # один и тот же сигнал скрытого дефицита в последних анализах подряд (разные даты)
    min_records: 2               # анализов разных дат, где показатель сдан
    max_gap_months: 24           # разрыв между соседними анализами серии больше — серия «подряд» прерывается
  screening_repeat:              # риск по скринингу ОАК повышен в нескольких анализах, а ферритин ни разу не сдан
    min_records: 2
    risks: [elevated, high]      # уровни риска из screen_thresholds.yaml, которые считаются
  stale:                         # «давно»: последний анализ старше стольких календарных месяцев на сегодня
    months: 12                   # ОАК и остальные анализы базового набора; событие cbc_stale
    ferritin_low_months: 6       # ферритин, если последний был ниже порога практики ferritin.deficiency_below.ru
  flat:                          # «шум»: |последнее − первое| меньше порога — направление ряда flat («без изменений»)
    default_pct: 5               # % от первого значения ряда — для показателей без своей строки ниже
    pct: {ferritin: 15, serum_iron: 20, TSAT: 20, CRP: 25, vitamin_B12: 10, folate: 15}   # % от первого значения
    abs: {hemoglobin: 5, MCV: 2, MCH: 1, RDW: 0.5, hematocrit: 1.5}   # в канонической единице показателя (analytes.yaml)
  limits:                        # ограничения объёма (не медицинские пороги): огромная история не должна тормозить кабинет
    max_points: 100              # точек в ряду на показатель — последние; изменение и направление — по показанным точкам
    max_records: 500             # записей в разборе — последние по дате; более ранние не учитываются
