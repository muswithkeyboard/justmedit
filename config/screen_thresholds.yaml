version: '2026-10-04b'
_comment: Рабочая точка скрининга скрытого дефицита железа. Пороги вероятности лежат
  в models/screen-v1/metadata.json (квантили предсказаний по людям без анемии, метки не используются);
  здесь — выбор точки. Врач команды может выбрать 0.20 или 0.40.
target: p_ferritin_lt15
refer_share: 0.3
high_share: 0.1
# Порог вероятности берётся по ПРОВЕРЕННОЙ группе и применяется ко всем: «направляем, если вероятность
# ферритина < 15 мкг/л не ниже, чем у верхних 30 % женщин 18–49 лет». Иначе у мужчин и женщин 50+ порог
# «верхние 30 % своей группы» падает ниже 1 % вероятности и направление теряет смысл.
threshold_group: F18-49
validated_groups:
- F18-49
risk_ru:
  usual: обычный
  elevated: повышенный
  high: высокий
