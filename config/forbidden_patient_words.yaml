# Запрещённые подстроки в тексте ПАЦИЕНТУ (нижний регистр; сравнение без учёта регистра, «ё» = «е»).
# Если строка отчёта пациента содержит любую из них, строка целиком заменяется нейтральной:
# «Обсудите этот результат с врачом.» (src/deficitlens_core/reports/__init__.py -> filter_patient_line).
# Это страховка: шаблоны config/texts_ru/patient.yaml таких слов не содержат (проверяет tests/core/test_reports.py).
# Подстроки короткие («рак», «бад») совпадают и внутри других слов («практика», «характер») — такие слова
# в текстах пациента не используются.
# Слова «здоров» и «всё в порядке» запрещаются условно (если есть анемия или сигнал скрытого дефицита):
# список — в config/texts_ru/patient.yaml -> forbidden_if_finding.
# Статус: черновик до врача команды (review: needs_medical_expert).
version: "2026-10-04"
